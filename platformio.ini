; ESP32blue_team — defensive/forensic recon firmware
; See CLAUDE.md for scope. v1: active Wi-Fi scan, passive Wi-Fi sniff,
; BLE scan, CSV/JSON logging to SD/serial, serial menu.

[platformio]
default_envs = esp32dev

; ---- Firmware target ----
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Iinclude
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST
    -Iinclude